[build-system]
requires = ["setuptools>=65,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-quiz"
version = "1.6.0.dev9"
description = "岿枢题典：完全离线的 Windows 题库与考试工具"
requires-python = ">=3.8,<3.9"
dependencies = [
  "PySide2==5.15.2.1",
  "openpyxl==3.1.5",
  "python-docx==1.1.2",
  "python-pptx==1.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-qt==4.4.0", "pyinstaller==6.16.0"]

[project.scripts]
offline-quiz = "offline_quiz.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside2"
